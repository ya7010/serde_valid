[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "3.1.2"
# tombi: lint.rules.deprecated.disabled = true
authors = ["ya7010 <ya7010@outlook.com>"]
edition = "2021"
repository = "https://github.com/ya7010/serde_valid.git"
license = "MIT"
keywords = ["json_schema", "serde", "validation"]

[workspace.dependencies]
indexmap = { version = "^2.0", features = ["serde"] }
intl-memoizer = "0.5"
itertools = "^0.14.0"
num-traits = "^0.2"
proc-macro2 = "^1.0"
quote = "^1.0"
regex = "^1.12"
serde = "^1.0"
serde_json = "^1.0"
serde_toml = { package = "toml", version = "^0.8" }
serde_valid_derive = { path = "crates/serde_valid_derive", version = "3.1.2" }
serde_valid_literal = { path = "crates/serde_valid_literal", version = "3.1.2" }
serde_yaml = { version = "^0.9" }
strsim = "^0.11"
syn = { version = "^3.0", features = ["full"] }
thiserror = "^1.0"
unic-langid = "0.9"
unicode-segmentation = "^1.7"
